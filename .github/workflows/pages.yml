name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /aura-spatial-perception/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-triangulation.txt

      - name: Install local triangulation dependencies
        run: python -m pip install -r tools/requirements-triangulation.txt

      - name: Test spherical triangulation geometry
        run: python -m unittest tools/test_triangulate_two_panoramas.py -v

      - name: Install exact dependencies
        run: npm ci

      - name: Run the full test and build gate
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
